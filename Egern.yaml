- 172.16.0.0/12
- 10.0.0.0/8
- 192.168.0.0/16
dns:
  bootstrap:
  - 119.29.29.29
  - 223.5.5.5
  upstreams:
    SSID转发:
    - system
    谷歌:
    - https://8.8.8.8/dns-query
    国外:
    - https://8.8.8.8/dns-query
    - https://1.1.1.1/dns-query
    国内:
    - https://doh.pub/dns-query
    - h3://dns.alidns.com/dns-query
    腾讯:
    - https://doh.pub/dns-query
    阿里:
    - h3://dns.alidns.com/dns-query
    字节:
    - h3://dns.alidns.com/dns-query
  forward:
  - ssid:
      match: 404 NotFound
      value: SSID转发
      disabled: false
  - proxy_rule_set:
      match: https://rule.kelee.one/Loon/YouTube.lsr
      value: 谷歌
      disabled: false
  - proxy_rule_set:
      match: https://rule.kelee.one/Loon/Google.lsr
      value: 谷歌
      disabled: false
  - proxy_rule_set:
      match: https://rule.kelee.one/Loon/DouYin.lsr
      value: 字节
      disabled: false
  - proxy_rule_set:
      match: https://rule.kelee.one/Loon/TestFlight.lsr
      value: 国外
      disabled: false
  - proxy_rule_set:
      match: https://rule.kelee.one/Loon/Apple.lsr
      value: 国内
      disabled: false
  - proxy_rule_set:
      match: https://rule.kelee.one/Loon/Alibaba.lsr
      value: 阿里
      disabled: false
  - proxy_rule_set:
      match: https://rule.kelee.one/Loon/Tencent.lsr
      value: 腾讯
      disabled: false
  - proxy_rule_set:
      match: https://rule.kelee.one/Loon/ChinaMax.lsr
      value: 国内
      disabled: false
  - proxy_rule_set:
      match: https://rule.kelee.one/Loon/Global.lsr
      value: 国外
      disabled: false
  - domain_wildcard:
      match: '*'
      value: 国外
      disabled: false
  proxy_nameservers:
  - https://doh.pub/dns-query
  - h3://dns.alidns.com/dns-query
